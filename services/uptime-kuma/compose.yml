services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    container_name: uptime-kuma
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - /DATA/AppData/uptime-kuma:/app/data

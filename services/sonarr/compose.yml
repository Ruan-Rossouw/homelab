services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Africa/Johannesburg}
    volumes:
      - /DATA/AppData/sonarr/config:/config
      - /DATA/AppData/decypharr/downloads:/downloads
      - /DATA/AppData/decypharr/mnt:/mnt:rshared
      - /DATA/AppData/media-library/tv:/tv
    ports:
      - "${SONARR_PORT:-8989}:8989"

services:
  byparr:
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: byparr
    restart: unless-stopped
    mem_limit: 2g
    # Headroom against a known upstream leak (github.com/ThePhaseless/Byparr#294):
    # get_browser() spawns a fresh browser per request and its cleanup doesn't
    # force-kill the process tree if the browser crashed mid-request, so a dead
    # generation's Xvfb+driver+Firefox processes linger. 512 was exhausted by
    # accumulated orphans within ~4h; doubled for margin alongside cutting
    # Uptime Kuma's poll interval (60s -> 900s) to reduce the request volume
    # that triggers the leak.
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${BYPARR_PORT:-8192}:8191"

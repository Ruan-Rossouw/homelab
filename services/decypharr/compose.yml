services:
  decypharr:
    image: cy01/blackhole:v2.7
    container_name: decypharr
    restart: unless-stopped
    mem_limit: 3g
    pids_limit: 512
    environment:
      # PUID=0: keeps the container's own process at root so cap_add:
      # SYS_ADMIN survives (see README "FUSE Mount Broken by Kernel
      # Update"). PGID=1000 + UMASK=002: without this, everything
      # Decypharr creates under /downloads is root:root mode 755, which
      # Sonarr/Radarr (running as 1000:1000) can't write/delete into
      # during import -- breaks with EACCES on every new grab. Matching
      # the group and loosening the umask to group-writable fixes that
      # without going fully world-writable.
      - PUID=0
      - PGID=1000
      - UMASK=002
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${DECYPHARR_PORT:-8282}:8282"
    volumes:
      - /DATA/AppData/decypharr/config:/app
      - /DATA/AppData/decypharr/cache:/cache
      - /DATA/AppData/decypharr/downloads:/downloads
      - /DATA/AppData/decypharr/mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # no-new-privileges intentionally omitted: fusermount3 needs its setuid-root
    # escalation to attach the DFS mount even with cap_add: SYS_ADMIN already
    # granted; blocking it breaks the mount outright. See README "Privilege
    # Footprint" section.

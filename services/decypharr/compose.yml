services:
  decypharr:
    image: cy01/blackhole:v2.5
    container_name: decypharr
    restart: unless-stopped
    mem_limit: 3g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${DECYPHARR_PORT:-8282}:8282"
    volumes:
      - /DATA/AppData/decypharr/config:/app
      - /DATA/AppData/decypharr/cache:/cache
      - /DATA/AppData/decypharr/downloads:/downloads
      - /DATA/AppData/decypharr/mnt:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # no-new-privileges intentionally omitted: fusermount3 needs its setuid-root
    # escalation to attach the DFS mount even with cap_add: SYS_ADMIN already
    # granted; blocking it breaks the mount outright. See README "Privilege
    # Footprint" section.

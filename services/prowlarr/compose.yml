services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Africa/Johannesburg}
    volumes:
      - /DATA/AppData/prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"

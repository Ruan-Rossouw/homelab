services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${ADGUARD_WEBUI_PORT:-3000}:3000/tcp"
    volumes:
      - /DATA/AppData/adguard/work:/opt/adguardhome/work
      - /DATA/AppData/adguard/conf:/opt/adguardhome/conf

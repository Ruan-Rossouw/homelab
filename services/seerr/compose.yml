services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    init: true
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Africa/Johannesburg}
    volumes:
      - /DATA/AppData/seerr/config:/app/config
    ports:
      - "${SEERR_PORT:-5055}:5055"

services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    restart: unless-stopped
    mem_limit: 1536m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC}
    volumes:
      - /DATA/AppData/grafana:/var/lib/grafana
      - ./config/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./config/dashboards:/etc/grafana/dashboards:ro

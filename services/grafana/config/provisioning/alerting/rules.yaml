apiVersion: 1

groups:
  - orgId: 1
    name: system_health
    folder: System Health
    interval: 1m
    rules:
      - uid: high_cpu_sustained
        title: Sustained High CPU
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "CPU usage has been above 85% for 15+ minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: high_load_sustained
        title: Sustained High Load Average
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "15-min load average has been above 1.5x the core count (8 cores) for 15+ minutes -- often the earlier, clearer signal of I/O-bound overload than raw CPU%."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'node_load15 / 8'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: backup_disk_capacity
        title: Backup Drive Capacity High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "/DATA/Backup is above 90% full."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (node_filesystem_avail_bytes{mountpoint="/DATA/Backup"} / node_filesystem_size_bytes{mountpoint="/DATA/Backup"} * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: internal_disk_capacity
        title: Internal Drive Capacity High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "/DATA (internal drive) is above 90% full -- worth checking docker image prune given Renovate now drives regular version bumps."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (node_filesystem_avail_bytes{mountpoint="/DATA"} / node_filesystem_size_bytes{mountpoint="/DATA"} * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: swap_pressure_sustained
        title: Sustained Swap Usage
        condition: C
        for: 15m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Swap usage has been above 80% for 15+ minutes -- an early warning sign of memory pressure, often precedes the kind of slowdown seen in the 2026-07-30 backup incident."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: container_restart_loop
        title: Container Restart Loop
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A container has restarted more than twice in the last 15 minutes -- likely crash-looping. cAdvisor has no direct restart-count metric, so this detects it via container_start_time_seconds changing repeatedly."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'changes(container_start_time_seconds{name!=""}[15m])'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: server_on_battery_power
        title: Server Running on Battery Power
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "This server has no external UPS -- its own internal laptop battery is the only thing keeping it up right now. It has a limited, untested runtime (see docs/roadmap.md's Phase 5 UPS-integration note); a host-level systemd timer will shut it down gracefully once the battery drops to 20% to avoid an unclean power-off."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'node_power_supply_online{power_supply="AC"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: media_disk_capacity
        title: Media Drive Capacity High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "/DATA/Media is above 90% full -- the most actively growing volume via Radarr/Sonarr/Decypharr."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '100 - (node_filesystem_avail_bytes{mountpoint="/DATA/Media"} / node_filesystem_size_bytes{mountpoint="/DATA/Media"} * 100)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: smart_health_failed
        title: Disk SMART Health Failed
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "A drive's overall SMART health status is FAILED -- this box has no RAID at any layer (see docs/storage.md), so a failing drive is a single point of failure. Check `smartctl -a` on the affected device and back up anything not already covered by restic immediately."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'smartctl_device_smart_status'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

      - uid: smart_reallocated_pending_sectors
        title: Disk SMART Reallocated/Pending Sectors Detected
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "A drive is reporting a nonzero Reallocated_Sector_Ct or Current_Pending_Sector count -- the classic early-warning sign of a failing drive, ahead of an outright SMART health FAILED status. Worth investigating even at a low count given this box has no RAID at any layer (see docs/storage.md). Known limitation: this only covers SATA-attribute drives, not NVMe -- see docs/zimaos.md's SMART Disk Health Capture section."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector", attribute_value_type="raw"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              refId: B
              conditions:
                - evaluator:
                    type: gt
                    params: []
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query

apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy_webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://ntfy.sh
          httpMethod: POST
          payload:
            template: |
              {
                "topic": "$NTFY_TOPIC",
                "title": "Grafana: {{ .CommonLabels.alertname }}",
                "message": "{{ .Status | toUpper }} - {{ .CommonAnnotations.summary }}",
                "priority": 4,
                "tags": ["warning"]
              }

policies:
  - orgId: 1
    receiver: ntfy
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
